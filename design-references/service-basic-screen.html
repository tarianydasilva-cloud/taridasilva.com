<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:400;src:url(https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.1.0/files/montserrat-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.1.0/files/montserrat-latin-500-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
body{width:833px;height:1665px;font-family:M,sans-serif;background:#efeff1;color:#141414;overflow:hidden}
.top{background:#fff;height:418px;position:relative}
.status{position:absolute;top:58px;left:72px;right:46px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:34px}
.icons{display:flex;gap:12px;align-items:center}
.bars{display:flex;gap:4px;align-items:flex-end}.bars i{width:6px;background:#141414;border-radius:2px}
.bat{width:46px;height:24px;border:2.5px solid #141414;border-radius:8px;position:relative}.bat::after{content:"";position:absolute;inset:3px 14px 3px 3px;background:#141414;border-radius:3px}
.head{position:absolute;top:205px;left:0;right:0;text-align:center;font-size:42px;font-weight:500}
.head span{position:absolute;left:44px;top:-14px;font-size:54px;font-weight:400}
.pill{position:absolute;top:300px;left:38px;background:#ff4a12;color:#141414;font-weight:600;font-size:34px;padding:22px 30px;border-radius:18px}
.body{padding:44px 38px 0}
.chip{display:inline-block;background:#fff;border-radius:18px;font-size:26px;font-weight:500;padding:30px 30px}
.cards{display:flex;gap:33px;margin-top:62px;width:1200px}
.card{width:320px;height:267px;background:#fff;border-radius:22px;padding:22px 20px;display:flex;align-items:flex-end;font-size:34px;line-height:1.2}
.label{margin-top:58px;font-size:34px;color:#5f5f66}
.list{margin-top:30px;background:#fff;border-radius:22px;padding:0 44px}
.row{display:flex;justify-content:space-between;align-items:center;height:132px;font-size:34px;border-bottom:2px solid #ececee}
.row:last-child{border-bottom:0}
.row b{font-weight:400;font-size:40px}
</style></head><body>
